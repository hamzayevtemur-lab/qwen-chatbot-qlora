<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen 2.5 AI Assistant | Fine-Tuned Chatbot</title>

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Markdown & Code Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar / Settings Drawer -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-badge">
                    <span class="pulse-dot"></span>
                    <span class="brand-title">Qwen2.5-1.5B</span>
                </div>
                <span class="badge-qlora">QLoRA SFT</span>
            </div>

            <div class="sidebar-content">
                <button id="newChatBtn" class="btn-primary-ghost">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Conversation
                </button>

                <div class="settings-group">
                    <label for="systemPrompt">System Persona</label>
                    <textarea id="systemPrompt"
                        rows="3">You are a helpful, respectful, and intelligent AI assistant.</textarea>
                </div>

                <div class="settings-group">
                    <div class="slider-header">
                        <label for="tempSlider">Temperature</label>
                        <span id="tempValue">0.7</span>
                    </div>
                    <input type="range" id="tempSlider" min="0.1" max="1.5" step="0.05" value="0.7">
                </div>

                <div class="settings-group">
                    <div class="slider-header">
                        <label for="maxTokensSlider">Max Tokens</label>
                        <span id="maxTokensValue">512</span>
                    </div>
                    <input type="range" id="maxTokensSlider" min="64" max="1536" step="64" value="512">
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="status-dot green"></span>
                    <span class="status-text">Backend Connected</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Window -->
        <main class="chat-container">

            <!-- Top Bar -->
            <header class="chat-header">
                <div class="header-info">
                    <h2>Conversational Assistant</h2>
                    <p class="subtitle">Fine-tuned on UltraChat with 4-bit NormalFloat quantization</p>
                </div>
                <div class="header-actions">
                    <button id="clearBtn" class="btn-icon" title="Clear Chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Message Stream Area -->
            <div id="messagesContainer" class="messages-area">

                <!-- Welcome Hero -->
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">⚡</div>
                    <h3>Welcome to Qwen2.5-1.5B Chat</h3>
                    <p>This assistant has been fine-tuned from a raw base foundation model into a multi-turn dialogue
                        agent.</p>

                    <div class="prompt-chips">
                        <button class="chip"
                            data-prompt="Explain how QLoRA and 4-bit NormalFloat quantization save GPU VRAM.">💡 How
                            does QLoRA work?</button>
                        <button class="chip"
                            data-prompt="Write a Python script to sort a list of dictionaries by a specific key.">🐍
                            Python sorting function</button>
                        <button class="chip"
                            data-prompt="Draft a polite email asking for an update on a software engineering job application.">✉️
                            Job follow-up email</button>
                    </div>
                </div>

            </div>

            <!-- Input Bar -->
            <footer class="input-container">
                <form id="chatForm" class="input-form">
                    <textarea id="userInput" placeholder="Type your message here... (Shift+Enter for new line)" rows="1"
                        autofocus></textarea>

                    <button type="submit" id="sendBtn" class="btn-send" aria-label="Send message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </footer>

        </main>

    </div>

    <script src="/static/app.js"></script>
</body>

</html>
